<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나만의 보물 지도 퀘스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Fredoka:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
/* Layout: a toy town from above — grey streets you can walk on, sandy lots that hold buildings; map left, task panel right */
:root{
  --bg:#e8f3f7; --surface:#ffffff; --surface-2:#f3f8fa; --ink:#1c3340; --muted:#587080; --line:#d2e3ea;
  --asphalt:#59616a; --dash:#f4f1e6; --curb:#e9d6a9;
  --accent:#ffb627; --accent-ink:#3b2700; --accent-soft:#fff0c7;
  --sky:#2c7fc3; --sky-soft:#dfeefa; --ok:#1f9256; --ok-soft:#daf2e5; --bad:#d4483a; --bad-soft:#fde4df; --warn:#a86a00; --warn-soft:#fff3d6;
  --left:#7b4fd6; --right:#e0663a; --pink:#f0679a; --shadow:0 3px 0 rgba(28,51,64,.10);
  --f-display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-en:"Fredoka","Gowun Dodum",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111c22; --surface:#1a2830; --surface-2:#21323b; --ink:#e5f0f5; --muted:#9ab3c0; --line:#2e4450;
  --asphalt:#3a4148; --dash:#8a8775; --curb:#6b5d40;
  --accent:#ffc24d; --accent-ink:#2b1c00; --accent-soft:#3e3216;
  --sky:#70b6ef; --sky-soft:#1c3446; --ok:#4fca8a; --ok-soft:#173727; --bad:#ff8b78; --bad-soft:#40231f; --warn:#ffcc66; --warn-soft:#3a3018;
  --left:#a98cf2; --right:#ff9a70; --pink:#ff8fb8; --shadow:0 3px 0 rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111c22; --surface:#1a2830; --surface-2:#21323b; --ink:#e5f0f5; --muted:#9ab3c0; --line:#2e4450;
  --asphalt:#3a4148; --dash:#8a8775; --curb:#6b5d40;
  --accent:#ffc24d; --accent-ink:#2b1c00; --accent-soft:#3e3216;
  --sky:#70b6ef; --sky-soft:#1c3446; --ok:#4fca8a; --ok-soft:#173727; --bad:#ff8b78; --bad-soft:#40231f; --warn:#ffcc66; --warn-soft:#3a3018;
  --left:#a98cf2; --right:#ff9a70; --pink:#ff8fb8; --shadow:0 3px 0 rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:0 32px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.2;text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:1400px;margin:0 auto}
img{display:block}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.brand img{width:44px;height:44px;object-fit:contain}
.brand b{font-family:var(--f-display);font-weight:400;font-size:1.3rem;display:block;line-height:1.1}
.brand small{display:block;font-family:var(--f-en);color:var(--muted);font-size:.74rem;letter-spacing:.06em}
.topr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{font-size:.78rem;padding:4px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.on{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.me{display:flex;align-items:center;gap:6px;padding:3px 12px 3px 3px;border-radius:99px;border:2px solid var(--line);background:var(--surface);font-size:.9rem}
.me img{width:30px;height:30px;object-fit:contain}

.btn{border-radius:14px;padding:11px 18px;font-family:var(--f-display);font-size:1.05rem;background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:var(--shadow);transition:transform .08s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.blue{background:var(--sky);color:#fff;border-color:transparent}
.btn.green{background:var(--ok);color:#fff;border-color:transparent}
.btn.danger{background:var(--bad);color:#fff;border-color:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.small{padding:7px 13px;font-size:.92rem;border-radius:11px}
.link{background:none;border:0;color:var(--sky);text-decoration:underline;padding:0;font-size:.9rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}

.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;align-items:center;padding-block:12px 4px}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h1{font-size:clamp(2rem,5.6vw,3.1rem)}
.hero h1 em{font-style:normal;color:var(--pink)}
.hero p{color:var(--muted);max-width:52ch;margin-top:10px}
.hero-art{display:flex;align-items:flex-end;justify-content:center;gap:4px}
.hero-art .hero-pic{width:100%;max-width:520px;aspect-ratio:3/2;object-fit:cover;border-radius:22px;box-shadow:0 6px 0 rgba(28,51,64,.08),0 10px 28px rgba(28,51,64,.12)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:22px}
.mode{display:flex;gap:16px;align-items:center;text-align:left;padding:20px;border-radius:22px;border:2px solid var(--line);background:var(--surface);box-shadow:0 4px 0 var(--line)}
.mode:hover{border-color:var(--accent)}
.mode img{width:76px;height:76px;object-fit:contain;flex:none}
.mode h2{font-size:1.4rem}
.mode .en{font-family:var(--f-en);color:var(--muted);font-size:.8rem;letter-spacing:.06em;display:block;margin-bottom:4px}
.mode p{margin-top:4px;color:var(--muted);font-size:.93rem}
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:20px}
.tip{background:var(--surface-2);border-radius:16px;padding:14px 16px;font-size:.92rem;color:var(--muted)}
.tip b{display:block;color:var(--ink);font-family:var(--f-display);font-weight:400;font-size:1.05rem;margin-bottom:2px}

.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:20px;min-width:0}
.narrow{max-width:600px;margin:16px auto 0}
label.f{display:block;font-size:.9rem;color:var(--muted);margin:14px 0 6px}
.input{width:100%;border:2px solid var(--line);border-radius:12px;padding:11px 14px;background:var(--surface-2);font-size:1.05rem}
.input:focus{border-color:var(--sky);outline:none}
.fgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.5fr) minmax(0,.8fr) minmax(0,1fr);gap:10px}
.fgrid select.input{width:100%;min-width:0;padding:10px 8px}
.fgrid .row select.input{flex:1}
.narrow{max-width:720px}
.fgrid2{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.codein{font-family:var(--f-en);letter-spacing:.12em;text-transform:uppercase}
#pSchoolName{display:block;margin-top:4px;min-height:1.2em}
@media (max-width:560px){.fgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.fgrid label.f{margin-top:0}
.hint{font-size:.88rem;color:var(--muted)}
.err{color:var(--bad);font-size:.9rem;min-height:1.3em;margin-top:6px}

.avatars{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
@media (max-width:520px){.avatars{grid-template-columns:repeat(4,minmax(0,1fr))}}
.av{border:3px solid transparent;border-radius:16px;background:var(--surface-2);padding:4px;aspect-ratio:1}
.av img{width:100%;height:100%;object-fit:contain}
.av.sel{border-color:var(--accent);background:var(--accent-soft)}

.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.choice{display:flex;gap:12px;align-items:center;text-align:left;border:3px solid var(--line);border-radius:16px;background:var(--surface-2);padding:12px 14px}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice b{font-family:var(--f-en);font-size:1.25rem;font-weight:600;display:block}
.choice small{color:var(--muted);font-size:.82rem;display:block}
.minigrid{flex:none;display:grid;gap:2px;width:44px;height:44px;padding:3px;border-radius:7px;background:var(--curb)}
.minigrid i{background:var(--asphalt);border-radius:2px}
.tchoices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tc{border:3px solid var(--line);border-radius:14px;background:var(--surface-2);padding:8px 4px;font-family:var(--f-en);font-size:.8rem;display:flex;flex-direction:column;align-items:center;gap:4px}
.tc img{width:52px;height:52px;object-fit:contain}
.tc.sel{border-color:var(--accent);background:var(--accent-soft)}
.sub{font-family:var(--f-display);font-size:1rem;margin-bottom:6px}

.stepper{display:flex;gap:8px;margin:4px 0 16px;padding:0;list-style:none;flex-wrap:wrap}
.stepper li{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:99px;background:var(--surface);border:2px solid var(--line);color:var(--muted);font-size:.9rem}
.stepper li span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-family:var(--f-display)}
.stepper li.now{border-color:var(--accent);color:var(--ink)}
.stepper li.now span{background:var(--accent);color:var(--accent-ink)}
.stepper li.done span{background:var(--ok);color:#fff}

.work{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:820px){.work{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.side h2{font-size:1.45rem}
.who{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted);flex-wrap:wrap}
.who img{width:30px;height:30px;object-fit:contain}
.qtitle{font-family:var(--f-display);font-size:1.15rem;color:var(--ink)}
.lvl{font-family:var(--f-en);font-weight:600;font-size:.74rem;padding:2px 9px;border-radius:99px;letter-spacing:.04em}
.lvl.e{background:var(--ok-soft);color:var(--ok)}
.lvl.h{background:var(--bad-soft);color:var(--bad)}

/* map: empty cells are streets, filled cells are lots */
.mapcol{display:flex;flex-direction:column;gap:12px;min-width:0}
.mapbox{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:12px;min-width:0;container-type:inline-size}
.compass{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.grid{position:relative;display:grid;gap:3px;padding:3px;aspect-ratio:1;max-width:100%;background:var(--curb);border-radius:16px}
.cell{position:relative;border:0;padding:0;border-radius:6px;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;transition:transform .1s, box-shadow .1s;
  background-color:var(--asphalt);
  background-image:repeating-linear-gradient(90deg,var(--dash) 0 5px,transparent 5px 11px),repeating-linear-gradient(0deg,var(--dash) 0 5px,transparent 5px 11px);
  background-size:100% 2px,2px 100%;background-position:0 50%,50% 0;background-repeat:no-repeat}
.cell.lot{background:var(--ground) center/cover;border-radius:9px}
.cell.click:hover{box-shadow:0 0 0 3px var(--accent);z-index:1}
.cell .pic{width:92%;height:92%;object-fit:contain;pointer-events:none}
.cell .lbl{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);max-width:96%;background:rgba(255,255,255,.92);color:#1c3340;border-radius:6px;padding:0 4px;font-family:var(--f-en);font-weight:500;font-size:clamp(.5rem,1.8cqi,.7rem);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.n7 .cell .lbl{font-size:clamp(.45rem,1.35cqi,.62rem)}
.n9 .cell .lbl{font-size:clamp(.4rem,1.05cqi,.52rem)}
@container (max-width:560px){.n9 .cell .lbl{display:none}}
@container (max-width:430px){.n7 .cell .lbl{display:none}}
.cell.start{cursor:default;background:var(--ground) center/cover;border-radius:9px}
.cell.start .face{position:absolute;right:-2px;top:-2px;width:44%;height:44%;object-fit:contain;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.cell .tbadge{position:absolute;top:1px;right:1px;width:40%;height:40%;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.cell.treasure{box-shadow:0 0 0 3px var(--pink);z-index:1}
.cell.picked{box-shadow:0 0 0 4px var(--sky);z-index:1}
.cell.picked::after{content:"?";position:absolute;left:3px;top:2px;width:24%;aspect-ratio:1;border-radius:50%;background:var(--sky);color:#fff;font-family:var(--f-en);font-weight:600;display:grid;place-items:center;font-size:clamp(.6rem,2.4cqi,.95rem)}
.cell.found{box-shadow:0 0 0 4px var(--ok);animation:pop .6s;z-index:1}
.cell.trail::before{content:"";position:absolute;inset:0;border-radius:6px;background:rgba(255,182,39,.35);pointer-events:none}
.cell.aim{box-shadow:0 0 0 4px var(--accent);animation:pop .5s;z-index:1}
.cell.aim.miss{box-shadow:0 0 0 4px var(--bad)}
@keyframes pop{50%{transform:scale(1.1)}}
.walker{position:absolute;left:0;top:0;pointer-events:none;transition:transform .34s ease-in-out;z-index:4;display:grid;place-items:center}
.walker img{width:74%;height:74%;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.45))}
.walker .arrow{position:absolute;inset:0;transition:transform .25s}
.walker .arrow::before{content:"";position:absolute;left:50%;top:-2%;transform:translateX(-50%);border-left:clamp(5px,1.6cqi,9px) solid transparent;border-right:clamp(5px,1.6cqi,9px) solid transparent;border-bottom:clamp(8px,2.4cqi,13px) solid var(--accent);filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.walker.bump{animation:shake .4s}
.htag{position:absolute;left:0;top:0;z-index:3;pointer-events:none;display:grid;place-items:center}
.htag span{font-family:var(--f-display);font-size:clamp(.6rem,2.3cqi,.95rem);padding:1px 7px;border-radius:99px;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);white-space:nowrap}
.htag.l span{background:var(--left)} .htag.r span{background:var(--right)} .htag.f span{background:var(--sky)}

/* direction helper */
.pad{border:2px solid var(--line);border-radius:18px;background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.pad h3{font-size:1.05rem}
.padbtns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pb{border:2px solid var(--line);border-radius:12px;background:var(--surface-2);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;font-family:var(--f-display);font-size:1rem}
.pb i{font-style:normal;font-size:1.3rem;line-height:1}
.pb small{font-family:var(--f-en);color:var(--muted);font-size:.68rem}
.pb:hover{border-color:var(--sky)}
.padmsg{font-size:.86rem;color:var(--muted);min-height:1.3em}
.padmsg.bad{color:var(--bad)}

/* palette */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 14px;font-size:.9rem}
.tab.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:6px;max-height:300px;overflow:auto;padding:2px}
.pal{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);font-family:var(--f-en);font-size:.72rem;line-height:1.1;text-align:center;min-width:0}
.pal img{width:46px;height:46px;object-fit:contain}
.pal small{color:var(--muted);font-family:var(--f-body);font-size:.7rem}
.pal.sel{border-color:var(--accent);background:var(--accent-soft)}

/* writing */
.bank{border:2px solid var(--line);border-radius:16px;overflow:hidden}
.bank table{min-width:0}
.bank td{padding:6px 12px;font-size:.88rem}
.bank td.en{font-family:var(--f-en);font-size:.98rem;white-space:nowrap}
.bank td.en u{text-decoration:none;color:var(--muted)}
.bank td.ko{color:var(--muted)}
.bank tr:nth-child(odd) td{background:var(--surface-2)}
.places{display:flex;flex-wrap:wrap;gap:6px}
.pchip{border-radius:99px;padding:4px 10px 4px 4px;background:var(--accent-soft);display:inline-flex;align-items:center;gap:5px;font-size:.84rem}
.pchip img{width:22px;height:22px;object-fit:contain}
.pchip b{font-family:var(--f-en);font-weight:500}
textarea.write{width:100%;min-height:150px;resize:vertical;border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface-2);font-family:var(--f-en);font-size:1.08rem;line-height:1.6}
textarea.write:focus{border-color:var(--sky);outline:none}

.checkbox{border:2px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.sents{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.sents li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;padding:7px 10px;border-radius:10px;background:var(--surface);font-size:.9rem;align-items:start}
.sents li .t{font-family:var(--f-en);font-size:.98rem;overflow-wrap:anywhere}
.sents li .a{display:block;color:var(--muted);font-size:.8rem}
.sents li.cur{outline:3px solid var(--accent)}
.sents li.bad{background:var(--bad-soft)}
.sents li.warn{background:var(--warn-soft)}
.sents li .w{display:block;color:var(--warn);font-size:.8rem}
.verdict{border-radius:12px;padding:12px 14px;font-family:var(--f-display);font-size:1.05rem}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.verdict small{display:block;font-family:var(--f-body);font-size:.85rem;margin-top:2px}

.board .side{font-size:1.08rem}.board h2.bq{font-size:1.6rem}.btn.big{font-size:1.1rem;padding:12px 18px}.directions.big{font-size:1.35rem}
#printArea{display:none}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{display:block;position:absolute;left:0;top:0;width:100%}.wrap{display:none}@page{size:A4;margin:12mm}body{background:#fff}}
.mixrows{display:grid;gap:6px;margin-top:4px}.mixrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.mixrow .lvn{min-width:84px}.mixrow .mixn{min-width:18px;text-align:center;font-size:1.15rem}
.eggbig{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--warn-soft,#fff4d6);border:2px dashed #f2b84b;border-radius:16px;padding:10px 14px;margin:6px 0}
.eggbig img{width:52px;height:52px;object-fit:contain}.eggbig span{flex:1;min-width:200px}
.tag.bigtag{background:#fff1cc;color:#8a5a00;border:1px solid #f2c45a;display:inline-flex;align-items:center;gap:3px}.tag.bigtag img{width:18px;height:18px;object-fit:contain}
.qcard.big{border-color:#f2c45a}
.cell.start{z-index:4;box-shadow:0 0 0 3px #e0245e,0 0 12px 4px rgba(224,36,94,.45);overflow:visible}
@media (prefers-reduced-motion: no-preference){.cell.start{animation:stpulse 1.8s ease-in-out infinite}}
@keyframes stpulse{0%,100%{box-shadow:0 0 0 3px #e0245e,0 0 8px 2px rgba(224,36,94,.35)}50%{box-shadow:0 0 0 3px #e0245e,0 0 16px 7px rgba(224,36,94,.55)}}
.cell .stdir{position:absolute;width:48%;height:48%;z-index:5;pointer-events:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.cell .stdir svg{width:100%;height:100%;display:block}
.cell .stdir.d0{top:-30%;left:50%;transform:translateX(-50%)}
.cell .stdir.d1{right:-30%;top:50%;transform:translateY(-50%) rotate(90deg)}

/* ===== 오타 찾기: 길 안내에 꼭 필요한 낱말이 한두 글자 틀리면 알려 줘요 ===== */
const KEYWORDS = ['go','walk','keep','going','straight','forward','ahead','turn','left','right','around','block','blocks','more',
  'next','between','front','treasure','your','one','two','three','four','five','six','seven','eight','and','then'];
const PLACE_WORDS = [...new Set(NAMES.flatMap(x => x.n.split(/[^a-z]+/)).filter(w => w.length >= 3))];
const COMMON = new Set(('a an the it its it\'s is are am be was i you we he she they my me to at in on of for with from by up down out into inside '+
  'this that there here where what how who see can find look go goes went near far side across corner street road way map town '+
  'hello hi hey friends friend please thank thanks yes no ok okay good great nice cool fun love like let lets let\'s now first second third last finally '+
  'after before when until stop start end also just very so but or if not do does don\'t will would could should might must '+
  'light night sight might fight tight black back band part pack bake bike boy toy try too to two tree trees three dear near '+
  'set sit lift lost list lent land lend tent ten nest best rest test text then than them they theme tune tone torn ton '+
  'own other another big small little old new red blue green yellow brown white pink house home school bus car shop shops '+
  'block blocks found get got come came take took put walked walking turned turning gone goes going walks turns '+
  'crossroads intersection crosswalk traffic lights light end middle english teacher teachers thank love much').split(/\s+/));
const VOCAB = new Set([...KEYWORDS, ...PLACE_WORDS, ...COMMON]);
function editDist(a, b){            // 글자 바꿈·빠짐·더함·자리 바뀜을 1로 세요
  const d = Array.from({length:a.length+1}, (_,i) => [i, ...Array(b.length).fill(0)]);
  for(let j=1;j<=b.length;j++) d[0][j] = j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++){
    const c = a[i-1]===b[j-1] ? 0 : 1;
    d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+c);
    if(i>1 && j>1 && a[i-1]===b[j-2] && a[i-2]===b[j-1]) d[i][j] = Math.min(d[i][j], d[i-2][j-2]+1);
  }
  return d[a.length][b.length];
}
const CONTR = {it:"it's", that:"that's", there:"there's", let:"let's", what:"what's", here:"here's", don:"don't"};
const PLACE_JOIN = new Set(NAMES.map(x => x.n).filter(x => !/\s/.test(x)));
const PLACE_SPACED = new Set(NAMES.map(x => x.n).filter(x => /\s/.test(x)));
function typosIn(sentence){
  const out = [], targets = [...KEYWORDS, ...PLACE_WORDS];
  const low = sentence.toLowerCase().replace(/[’‘`]/g,"'");
  const words = low.match(/[a-z']+/g) || [], skip = new Set();
  // 띄어 쓰면 안 되는 장소 이름: super market → supermarket
  for(let i=0;i<words.length-1;i++){
    const a = words[i].replace(/'+$/,''), b = words[i+1].replace(/^'+|'+$/g,'');
    if(PLACE_JOIN.has(a+b) && !PLACE_SPACED.has(a+' '+b)){ out.push({word:a+' '+b, fix:a+b}); skip.add(i); skip.add(i+1); }
  }
  // It's 를 It' / Its / It s 로 쓴 경우
  let cm; const reIts = /\b(its)\s+(?=on\b|in\b|next\b|between\b|straight\b|at\b|near\b|here\b|there\b)/g;
  while((cm = reIts.exec(low))){ const orig = sentence.substr(cm.index, 3); out.push({word:orig, fix:orig[0]+"t's", grammar:true}); }
  const reItS = /\bit\s+s\b/g;
  while((cm = reItS.exec(low))){ out.push({word:sentence.substr(cm.index, cm[0].length), fix:sentence[cm.index]+"t's", grammar:true}); }
  for(let wi=0; wi<words.length; wi++){
    if(skip.has(wi)) continue;
    const raw = words[wi];
    if(/^[a-z]+'$/.test(raw) && CONTR[raw.slice(0,-1)]){ out.push({word:raw, fix:CONTR[raw.slice(0,-1)]}); continue; }   // It' → It's
    const w = raw.replace(/^'+|'+$/g,'');
    if(w.length < 3 || VOCAB.has(w) || /^\d+$/.test(w)) continue;
    if(w.endsWith('s') && VOCAB.has(w.slice(0,-1))) continue;              // 복수형 (banks, trees)
    // 띄어쓰기를 빠뜨린 경우: turnright → turn right
    let split = null;
    for(let i=2;i<=w.length-2 && !split;i++){ const a = w.slice(0,i), b = w.slice(i); if(KEYWORDS.includes(a) && VOCAB.has(b) || VOCAB.has(a) && KEYWORDS.includes(b)) split = a+' '+b; }
    if(split){ out.push({word:raw, fix:split}); continue; }
    let best = null, bd = 9;
    for(const t of targets){ if(Math.abs(t.length-w.length) > 2) continue; const dd = editDist(w,t); if(dd < bd){ bd = dd; best = t; } }
    const limit = w.length >= 6 ? 2 : 1;
    if(best && bd <= limit) out.push({word:raw, fix:best});
  }
  // 단수·복수: one block / two blocks (one blocks ✗, 3 block ✗)
  const NUMV = {a:1, an:1, one:1, two:2, three:3, four:4, five:5, six:6, seven:7, eight:8};
  const re = /\b(\d+|an?|one|two|three|four|five|six|seven|eight)(\s*)(more\s+)?(blocks?)\b/gi;
  let m;
  while((m = re.exec(sentence))){
    const n = /\d/.test(m[1]) ? parseInt(m[1],10) : NUMV[m[1].toLowerCase()];
    const plural = /s$/i.test(m[4]);
    if(n===1 && plural) out.push({word:m[0], fix:`${m[1]}${m[2]||' '}${m[3]||''}block`, grammar:true});
    else if(n>1 && !plural) out.push({word:m[0], fix:`${m[1]}${m[2]||' '}${m[3]||''}blocks`, grammar:true});
  }
  return out;
}

function checkDirections(text, n, layout, treasure, start){
  const st = startOf(n, start);
  let pos = [st.r, st.c], dir = st.d, turns = 0, moved = 0;
  const frames = [{r:pos[0], c:pos[1], dir, si:-1}];
  const sents = (text.match(/[^.!?\n]+[.!?]*/g) || []).map(s => s.trim()).filter(Boolean).map(t => ({t, acts:[], warn:[], bad:false}));
  let target = null, finalSi = -1, error = null;
  const stat = {turnAtUsed:0, turnAtOk:0, nextUsed:0, nextOk:0, betweenUsed:0, betweenOk:0, betweenBad:false, nextBad:false, placeIssues:[]};
  const wrongPlace = (i, msg) => { sents[i].warn.push(msg); sents[i].bad = true; stat.placeIssues.push(msg); };
  const unknownPlace = str => {            // 지도에 없는 장소 이름 (corner, street 같은 낱말·철자 틀린 낱말은 빼요)
    const ws = str.trim().replace(/[^a-z' ]/g,' ').split(/\s+/).filter(Boolean);
    if(!ws.length || VOCAB.has(ws[0]) || typosIn(ws.slice(0,2).join(' ')).length) return null;
    return ws.slice(0,2).join(' ');
  };
  const onMap = key => Object.values(layout).includes(key);
  // 이동: Go straight (ahead) (for) 4 blocks / Go two blocks (straight) / Keep going straight …  — 한 문장 안에 and·then 으로 이어 써도 차례로 읽어요
  const TOK = /\b(?:go|walk|keep\s+going|keep\s+walking)\s+(?:(?:straight|forward|ahead)(?:\s+(?:ahead|on)\b)?(?:\s+(?:for\s+)?(\d+|one|two|three|four|five|six|seven|eight|an?)\s*(?:more\s+)?blocks?)?|(?:for\s+)?(\d+|one|two|three|four|five|six|seven|eight|an?)\s*(?:more\s+)?blocks?(?:\s+(?:straight|forward|ahead))?)|\bturn\s+(left|right|around)\b|\b(?:it'?s|it\s+is|the\s+treasure\s+is|you\s+can\s+(?:see|find)\s+(?:it|the\s+treasure))\s+(?:on\s+your\s+(left|right)|(in\s+front\s+of\s+you|straight\s+ahead))/g;
  outer:
  for(let i=0;i<sents.length;i++){
    const s = sents[i].t.toLowerCase().replace(/[’‘`]/g,"'");
    let m; TOK.lastIndex = 0;
    while((m = TOK.exec(s))){
      if(/^(go|walk|keep)/.test(m[0])){
        let steps = 1;
        const cnt = m[1] || m[2];
        if(/(?:\d|one|two|three|four|five|six|seven|eight)blocks?/.test(m[0])) sents[i].warn.push('숫자와 block 사이를 띄어 쓰면 더 좋아요. (4 blocks)');
        if(cnt) steps = /\d/.test(cnt) ? parseInt(cnt,10) : NUMW[cnt];
        else sents[i].warn.push('몇 블록인지 써 주면 친구가 덜 헷갈려요 (one block, two blocks…)');
        sents[i].acts.push(`앞으로 ${steps}칸`);
        for(let j=0;j<steps;j++){
          const np = [pos[0]+D[dir][0], pos[1]+D[dir][1]];
          if(!inMap(np,n)){ sents[i].bad = true; error = {si:i, msg:'이 문장에서 지도 밖으로 나가 버려요.', tip:'블록 수나 도는 방향을 다시 확인해요.'}; frames.push({r:pos[0],c:pos[1],dir,si:i,bump:true}); break outer; }
          const there = layout[k(np[0],np[1])];
          if(there){ sents[i].bad = true; error = {si:i, msg:`이 문장에서 ${pn(there)}을(를) 뚫고 지나가게 돼요.`, tip:"건물이 있는 칸은 지나갈 수 없어요. 건물 앞에서 멈추고 It's in front of you / on your left 처럼 알려 줘요."}; frames.push({r:pos[0],c:pos[1],dir,si:i,bump:true}); break outer; }
          pos = np; moved++; target = null; frames.push({r:pos[0], c:pos[1], dir, si:i});
        }
        finalSi = i;
      } else if(m[3]){
        if(m[3]==='around'){ dir = (dir+2)%4; sents[i].acts.push('뒤로 돌기'); }
        else {
          const atM = s.slice(TOK.lastIndex).match(/^\s+at\s+the\s+([a-z' ]+)/);        // Turn right at the ___ : 도는 그 자리에서 확인해요
          if(atM){ const key = placeIn(atM[1]);
            if(key){ stat.turnAtUsed++;
              if(touches(pos,layout,key)) stat.turnAtOk++;
              else wrongPlace(i, onMap(key) ? `여기서 돌 때 ${pn(key)}이(가) 바로 옆에 없어요. 도는 곳 옆에 있는 장소를 써요.` : `${pn(key)}은(는) 내 지도에 없어요. 도는 곳 옆에 있는 장소를 써요.`); }
            else { const u = unknownPlace(atM[1]); if(u) wrongPlace(i, `"${u}"은(는) 내 지도에서 찾을 수 없어요. 지도에 있는 장소 이름으로 써요.`); }
          }
          dir = (dir + (m[3]==='left'?3:1))%4; turns++; sents[i].acts.push(m[3]==='left'?'왼쪽으로 돌기':'오른쪽으로 돌기');
        }
        target = null; finalSi = i;
        frames.push({r:pos[0], c:pos[1], dir, si:i});
      } else {
        const off = m[4]==='left' ? 3 : m[4]==='right' ? 1 : 0, d2 = (dir+off)%4;
        target = [pos[0]+D[d2][0], pos[1]+D[d2][1]]; finalSi = i;
        sents[i].acts.push(m[4] ? `보물은 ${m[4]==='left'?'왼쪽':'오른쪽'} 칸` : '보물은 바로 앞 칸');
      }
    }
    const seeSide = s.match(/\bthe\s+(.+?)\s+(?:is\s+)?on\s+your\s+(left|right)/);
    if(seeSide){ const key = placeIn(seeSide[1]); if(key){
      const q = seeSide[2]==='left' ? around(pos[0],pos[1],dir).l : around(pos[0],pos[1],dir).rt;
      if(!inMap(q,n) || layout[k(q[0],q[1])]!==key) wrongPlace(i, `이 위치에서 ${pn(key)}은(는) ${seeSide[2]==='left'?'왼쪽':'오른쪽'}에 없어요.`);
    }}
  }
  if(!error){
    if(!target) target = pos;
    if(!sents.some(x => x.acts.length)) error = {si:-1, msg:'길 안내 표현을 찾지 못했어요.', tip:'Go straight / Turn left / Turn right 같은 표현으로 써요.'};
    else if(!moved && target[0]===st.r && target[1]===st.c) error = {si:-1, msg:'출발점에서 움직이지 않았어요.', tip:'"Go straight ___ block(s)."로 먼저 출발해 볼까요?'};
    else if(!inMap(target,n)) { error = {si:finalSi, msg:'보물이 지도 밖에 있는 것으로 안내돼요.', tip:"It's on your left / right 방향을 확인해요."}; if(finalSi>=0) sents[finalSi].bad = true; }

  const ref = treasure ? [treasure.r, treasure.c] : target;
  if(ref){
    for(let i=Math.max(finalSi,0); i<sents.length; i++){
      const s = sents[i].t.toLowerCase().replace(/[’‘`]/g,"'");
      let mm; const nextRe = /\bnext\s+to\s+the\s+(.+)/g;
      while((mm = nextRe.exec(s))){ const key = placeIn(mm[1]); if(key){ stat.nextUsed++; if(touches(ref,layout,key)) stat.nextOk++; else { stat.nextBad = true; wrongPlace(i, `보물 칸 바로 옆에 ${pn(key)}이(가) 없어요.`); } }
        else { const u = unknownPlace(mm[1]); if(u){ stat.nextUsed++; stat.nextBad = true; wrongPlace(i, `"${u}"은(는) 내 지도에서 찾을 수 없어요.`); } } }
      const bt = s.match(/\bbetween\s+the\s+(.+?)\s+and\s+the\s+(.+)/);
      if(bt){
        const keys = [bt[1],bt[2]].map(placeIn);
        stat.betweenUsed++;
        const bad = keys.filter(key => !key || !touches(ref,layout,key));
        if(!bad.length && keys[0]!==keys[1]) stat.betweenOk++;
        else { stat.betweenBad = true; keys.forEach(key => { if(key && !touches(ref,layout,key)) wrongPlace(i, `보물 칸 옆에 ${pn(key)}이(가) 없어요.`); }); if(keys.some(x=>!x)) wrongPlace(i, 'between 뒤에는 지도에 있는 장소 이름 두 개를 써 주세요.'); }
      }
    }
  }
  // 보물이 있는 건물 이름을 직접 쓰면 안 돼요 (It's in the bookstore. 처럼)
  stat.reveal = false;
  const tb = ref && layout[k(ref[0],ref[1])];
  sents.forEach((x,i) => {
    const s = x.t.toLowerCase().replace(/[’‘`]/g,"'");
    const re = /\b(?:in|inside|into)\s+the\s+(.+)|\b(?:is|it'?s|it\s+is)\s+at\s+the\s+(.+)|\bit'?s\s+the\s+(.+)/g;
    let mm;
    while((mm = re.exec(s))){
      const key = placeIn(mm[1]||mm[2]||mm[3]);
      if(!key) continue;
      if(tb && key===tb){ stat.reveal = true; x.bad = true; x.warn.push(`보물이 있는 곳(${pn(key)})을 직접 쓰면 친구가 바로 알아요. 길과 주변 장소로만 알려 줘요.`); }
      else if(i>=Math.max(finalSi,0) && ref) wrongPlace(i, `보물 칸은 ${pn(key)}이(가) 아니에요.`);

  sents.forEach(x => {
    const low = ' '+x.t.toLowerCase().replace(/[’‘`]/g,"'")+' ';
    const mentionsPlace = /treasure\s+is|treasure'?s\s+(?:next|between|on|in\s+front)/.test(low) || NAMES.some(({n:nm}) => new RegExp('[^a-z]'+nm.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'[^a-z]').test(low));
    x.typos = typosIn(x.t);
    x.kind = x.acts.length ? 'move' : mentionsPlace ? 'place' : x.typos.length ? 'typo' : 'other';
  });
  stat.typoCount = sents.reduce((a,x) => a + x.typos.length, 0);
  if(error && stat.typoCount){
    const list = sents.flatMap(x => x.typos).map(t => `${t.word} → ${t.fix}`).join(', ');
    error.tip = `철자가 틀린 낱말 때문에 문장을 제대로 읽지 못했을 수 있어요: ${list}. ` + (error.tip||'');
  }
  const sentCount = sents.filter(x => x.kind!=='other' && x.kind!=='typo').length;
  const hit = !error && treasure && target[0]===treasure.r && target[1]===treasure.c;
  if(!error && !hit){
    error = {si:finalSi, msg:`안내문을 따라가면 ${target[0]+1}행 ${target[1]+1}열에 도착해요. 보물은 다른 칸에 있어요!`, tip:'노란 칸과 분홍 테두리 보물 칸을 비교해 보고 문장을 고쳐요.'};
    if(finalSi>=0) sents[finalSi].bad = true;
  }
  return { ok:!!hit, frames, target, error, sents, turns, sentCount, ...stat, warnCount: sents.reduce((a,s)=>a+s.warn.length,0) };
}

/* 최단 경로에서 최소 몇 번 돌아야 보물에 닿는지 (길 칸으로만 이동, 보물 칸이 앞·왼쪽·오른쪽에 보이면 도착) */
function minTurns(n, layout, treasure, start){
  if(!treasure) return Infinity;
  const st = startOf(n, start), INF = 1e9, dist = {};
  const key = (r,c,d) => r*100+c*10+d;
  const dq = [[st.r, st.c, st.d, 0]]; dist[key(st.r,st.c,st.d)] = 0;
  const seesT = (r,c,d) => { if(r===treasure.r && c===treasure.c) return true;
    const a = around(r,c,d); return [a.f,a.l,a.rt].some(p => p[0]===treasure.r && p[1]===treasure.c); };
  while(dq.length){
    const [r,c,d,t] = dq.shift();
    if(t > (dist[key(r,c,d)] ?? INF)) continue;
    if(seesT(r,c,d)) return t;
    const nr = r+D[d][0], nc = c+D[d][1];
    if(inMap([nr,nc],n) && !layout[k(nr,nc)]){ const kk = key(nr,nc,d); if((dist[kk] ?? INF) > t){ dist[kk] = t; dq.unshift([nr,nc,d,t]); } }
    for(const nd of [(d+1)%4, (d+3)%4]){ const kk = key(r,c,nd); if((dist[kk] ?? INF) > t+1){ dist[kk] = t+1; dq.push([r,c,nd,t+1]); } }
  }
  return Infinity;
}
/* 기본 단계용: 보물까지 가장 적게 돌고(같으면 가장 짧게) 가는 길을 찾아 빈칸 문장 틀로 바꿔요 */
function bestRoute(n, layout, treasure, start){
  if(!treasure) return null;
  const st = startOf(n, start), key = (r,c,d) => r*100+c*10+d, best = {}, prev = {};
  const tIsRoad = !layout[k(treasure.r, treasure.c)];
  const seen = (r,c,d) => {
    if(tIsRoad && r===treasure.r && c===treasure.c) return 'here';
    const a = around(r,c,d), eq = p => p[0]===treasure.r && p[1]===treasure.c;
    return eq(a.f) ? 'front' : eq(a.l) ? 'left' : eq(a.rt) ? 'right' : null;
  };
  const pq = [[0, st.r, st.c, st.d]]; best[key(st.r,st.c,st.d)] = 0;
  while(pq.length){
    pq.sort((a,b) => a[0]-b[0]);
    const [cost, r, c, d] = pq.shift();
    if(cost > best[key(r,c,d)]) continue;
    const end = seen(r,c,d);
    if(end){                                         // 길을 거꾸로 따라가 동작 목록 만들기
      const acts = []; let kk = key(r,c,d);
      while(prev[kk]){ acts.unshift(prev[kk].a); kk = prev[kk].from; }
      return {acts, end, last:{r,c,d}};
    }
    const steps = [];
    const nr = r+D[d][0], nc = c+D[d][1];
    if(inMap([nr,nc],n) && !layout[k(nr,nc)] && !(nr===st.r && nc===st.c)) steps.push([nr,nc,d,1,'F']);
    steps.push([r,c,(d+3)%4,100,'L'], [r,c,(d+1)%4,100,'R']);   // 도는 횟수를 먼저 줄여요
    for(const [r2,c2,d2,w,a] of steps){
      const k2 = key(r2,c2,d2), nc2 = cost + w;
      if(best[k2]===undefined || nc2 < best[k2]){ best[k2] = nc2; prev[k2] = {from:key(r,c,d), a, at:[r,c]}; pq.push([nc2,r2,c2,d2]); }
    }
  }
  return null;
}
function routeFrames(n, layout, treasure, start){
  const R = bestRoute(n, layout, treasure, start);
  if(!R) return null;
  const out = [], st = startOf(n, start);
  let r = st.r, c = st.c, d = st.d, run = 0;
  const flush = () => { if(run){ out.push(['Go straight ___ block(s).', '___ 블록 곧장 가세요.']); run = 0; } };
  for(const a of R.acts){
    if(a==='F'){ r += D[d][0]; c += D[d][1]; run++; continue; }
    flush();
    const near = Object.keys(PLACES).some(key => touches([r,c], layout, key));
    out.push(near ? ['Turn ___ at the ___.', '___에서 ___쪽으로 도세요.'] : ['Turn ___.', '___쪽으로 도세요.']);
    d = a==='L' ? (d+3)%4 : (d+1)%4;
  }
  flush();
  if(R.end==='left' || R.end==='right') out.push(["It's on your ___.", '보물은 당신의 ___쪽에 있어요.']);
  else if(R.end==='front') out.push(["It's in front of you.", '보물은 바로 앞에 있어요.']);
  else out.push(['The treasure is here.', '보물은 바로 여기에 있어요.']);
  const tb = layout[k(treasure.r, treasure.c)];
  const hasNeighbor = Object.entries(layout).some(([kk,v]) => { const [a,b] = kk.split('-').map(Number); return v!==tb && Math.abs(a-treasure.r)+Math.abs(b-treasure.c)===1; });
  if(hasNeighbor) out.push(["It's next to the ___.", '보물은 ___ 옆에 있어요.']);
  return {frames: out, needNeighbor: !hasNeighbor};
}

/* 보물 위치가 고른 쓰기 단계에 맞는지 */
function placeCheck(level, n, layout, treasure, start){
  const L = LV[level], t = minTurns(n, layout, treasure, start), empty = !Object.keys(layout).length;
  if(!treasure) return {ok:false, t, msg:'아직 보물을 숨기지 않았어요.'};
  if(t===Infinity) return {ok:false, t, msg:'건물에 막혀서 보물까지 갈 수 있는 길이 없어요. 길(회색 칸)을 열어 주세요.'};
  if(L.maxTurns!=null && t > L.maxTurns) return {ok:false, t, msg:`지금은 최소 ${t}번 돌아야 갈 수 있어요. ${L.name} 단계는 한 번 이하로 돌아서 가는 곳이어야 해요.`};
  if(L.minTurns!=null && t < L.minTurns){
    if(empty) return {ok:true, t, pending:true, msg:'도전 단계: 다음 단계에서 건물로 길을 막아, 두 번 이상 돌아야 보물에 닿도록 만들어요.'};
    return {ok:false, t, msg:`지금은 ${t===0?'돌지 않고':'최소 '+t+'번만 돌아도'} 갈 수 있어요. 도전 단계는 두 번 이상 돌아야 하는 곳이어야 해요. 건물로 길을 막거나 보물을 옮겨요.`};
  }
  return {ok:true, t, msg: t===0 ? '돌지 않고 곧장 가면 보물에 닿아요.' : `최소 ${t}번 돌면 보물에 닿아요.`};
}
/* 보물 칸 주변 장소 알려 주기 (지도 기준) */
function nearbyText(n, layout, treasure){
  if(!treasure) return '';
  const nm = (r,c) => !inMap([r,c],n) ? '지도 밖' : layout[k(r,c)] ? pn(layout[k(r,c)]) : '길';
  const {r,c} = treasure;
  return `지도에서 보물 왼쪽에는 ${nm(r,c-1)}, 오른쪽에는 ${nm(r,c+1)}, 위에는 ${nm(r-1,c)}, 아래에는 ${nm(r+1,c)}이(가) 있어요.`;
}
/* 쓰기 체크리스트 */
function checklist(level, R, walkedOk){
  const L = LV[level] || LV[2], items = [];
  items.push({ok:!!walkedOk, label:'보물까지 정확히 도착', hint: walkedOk ? '' : '🚶 걸어 보기로 확인해요.'});
  items.push({ok:R.sentCount >= L.minSent, label:`${L.minSent}문장 이상`, hint:`지금 ${R.sentCount}문장 (인사말처럼 길과 상관없는 문장은 세지 않아요)`});
  if(L.next) items.push({ok:R.nextOk>0 || R.betweenOk>0, label:'next to (또는 between)', hint: (R.nextOk||R.betweenOk) ? '' : R.nextBad ? '보물 칸 바로 옆에 있는 장소로 써요.' : "It's next to the ___. 를 써요."});
  if(L.turnAt) items.push({ok:R.turnAtOk>0, label:'Turn left/right at the ___.', hint: R.turnAtUsed && !R.turnAtOk ? '도는 곳 바로 옆에 있는 장소로 써요.' : R.turnAtOk ? '' : '도는 곳에 있는 장소를 넣어 써요.'});
  const tps = [...new Map(R.sents.flatMap(x=>x.typos).map(t => [t.word+'>'+t.fix, t])).values()];
  items.push({ok:!R.typoCount, label:'철자 확인', hint: R.typoCount ? '틀린 낱말을 고쳐요: ' + tps.map(t=>`${t.word} → ${t.fix}`).join(', ') : '',
    hintHTML: R.typoCount ? '틀린 낱말을 고쳐요: ' + tps.map(t=>`<span class="tfix"><s>${esc(t.word)}</s> → <b>${esc(t.fix)}</b></span>`).join(' ') : ''});
  const pis = [...new Set(R.placeIssues||[])];
  items.push({ok:!pis.length, label:'장소 이름이 지도와 맞아요', hint: pis.length ? pis.slice(0,2).join(' / ') + (pis.length>2 ? ` 외 ${pis.length-2}개` : '') : ''});
  items.push({ok:!R.reveal, label:'보물 장소 이름 숨기기', hint: R.reveal ? '보물이 있는 건물 이름을 지워요. (It\'s in the ___. ✗)' : ''});
  if(L.between) items.push({ok:R.betweenOk>0, label:'between', hint: R.betweenBad ? 'between 의 두 장소가 모두 보물 칸 옆에 있어야 해요.' : R.betweenOk ? '' : "It's between the ___ and the ___. 를 써요."});
  return items;
}

  _t(token){ const d = dbLoad(), tid = d.sessions[token], t = tid && d.teachers.find(x => x.id===tid); if(!t) throw new Error(ERR.session); return [d, t]; },

function makeSupaStore(){
  const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  const MSG = [[/bad session/i, ERR.session], [/bad login/i, ERR.login], [/same pw/i, ERR.samepw], [/short pw/i, ERR.shortpw], [/bad school/i, ERR.school],
    [/bad join/i, ERR.join], [/too many tries/i, ERR.tries], [/no space/i, ERR.nospace], [/too many mine/i, ERR.mine], [/too many/i, ERR.many], [/bad seat/i, ERR.seat],
    [/bad title/i, ERR.title], [/bad label/i, ERR.label], [/teacher pin/i, ERR.pin], [/not player/i, ERR.notplayer], [/bad pin format/i, ERR.pinfmt],
    [/pin locked/i, ERR.pinlock], [/seat taken/i, ERR.seattaken],
    [/own quest/i, '내 퀘스트에는 하트를 누를 수 없어요.'], [/not solved/i, '보물을 찾은 뒤에 하트를 누를 수 있어요.']];
  const call = async (fn, args) => { const {data, error} = await sb.rpc(fn, args);
    if(error){ const hit = MSG.find(([re]) => re.test(error.message)); throw new Error(hit ? hit[1] : '서버에 연결하지 못했어요. 잠시 뒤 다시 해 주세요.'); }

    async lobby(code, pid){ const d = await call('tqs_lobby',{p_code:C(code), p_player:pid}); return d ? {...d, quests:(d.quests||[]).map(fixQ), solved:d.solved||[]} : null; },
    async getQuest(code, num, pid){ const d = await call('tqs_get_quest',{p_code:C(code), p_num:num, p_player:pid}); return d ? fixQ(d) : null; },
    async createQuest(code, p){ return await call('tqs_create_quest',{p_code:C(code), p_player:p.pid, p_avatar:p.avatar, p_title:p.title, p_level:p.level, p_size:p.size,
      p_layout:p.layout, p_directions:p.directions, p_row:p.treasure.r, p_col:p.treasure.c, p_icon:p.icon, p_revisions:p.revisions, p_listens:p.listens}); },
    async check(code, num, r, c, pid){ return !!(await call('tqs_check',{p_code:C(code), p_num:num, p_row:r, p_col:c, p_player:pid})); },
    async toggleHeart(code, num, pid){ return await call('tqs_toggle_heart',{p_code:C(code), p_num:num, p_player:pid}); },
    async updateTitleByCreator(code, num, pid, title){ const ok = await call('tqs_update_title',{p_code:C(code), p_num:num, p_player:pid, p_title:title}); if(!ok) throw new Error('내 퀘스트만 고칠 수 있어요.'); },
    async tSignup(school, pw, join, wrapped, salt, pub, priv_enc, key_id){ return await call('tqs_t_signup',{p_school:school, p_pw:pw, p_join:join||null, p_wrapped:wrapped, p_salt:salt, p_pub:pub, p_priv_enc:priv_enc, p_key_id:key_id}); },
    async tLogin(school, pw){ return await call('tqs_t_login',{p_school:school, p_pw:pw}); },
    async tLogout(token){ try{ await call('tqs_t_logout',{p_token:token}); }catch(e){} },

    async tSetKeys(token, wrapped, salt, pub, priv_enc, key_id){ await call('tqs_t_set_keys',{p_token:token, p_wrapped:wrapped, p_salt:salt, p_pub:pub, p_priv_enc:priv_enc, p_key_id:key_id}); },

/* ===== 이름 잠금 (브라우저 안에서만 풀려요) =====
   선생님 비밀번호 → '선생님 열쇠'(dk)를 잠가요. 이름을 여는 개인키는 dk로 잠가 서버에 두고,
   학생 기기는 공개키(자물쇠)로 이름을 잠가서 보내요. 서버·관리자는 이름을 열 수 없어요. */
const CRYPTO_OK = !!(window.crypto && crypto.subtle);
const b64 = u8 => { let s = ''; new Uint8Array(u8).forEach(b => s += String.fromCharCode(b)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function pwKey(pw, saltB64){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:unb64(saltB64), iterations:150000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function aesEnc(key, bytes){ const iv = crypto.getRandomValues(new Uint8Array(12)); return b64(iv) + '.' + b64(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, bytes)); }
async function aesDec(key, s){ const [iv, ct] = String(s).split('.'); return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(iv)}, key, unb64(ct))); }
async function wrapKey(pw, dkB64){ const salt = b64(crypto.getRandomValues(new Uint8Array(16))); return {salt, wrapped: await aesEnc(await pwKey(pw, salt), unb64(dkB64))}; }
async function newDataKey(pw){ const dk = b64(crypto.getRandomValues(new Uint8Array(32))); return {dk, ...(await wrapKey(pw, dk))}; }
async function unwrapKey(pw, wrapped, salt){ return b64(await aesDec(await pwKey(pw, salt), wrapped)); }
const dkObj = dk => crypto.subtle.importKey('raw', unb64(dk), 'AES-GCM', false, ['encrypt','decrypt']);
const RSA = {name:'RSA-OAEP', hash:'SHA-256'};
async function newKeyPair(dk){
  const kp = await crypto.subtle.generateKey({...RSA, modulusLength:2048, publicExponent:new Uint8Array([1,0,1])}, true, ['encrypt','decrypt']);
  const pub = b64(await crypto.subtle.exportKey('spki', kp.publicKey));
  const priv_enc = await aesEnc(await dkObj(dk), new Uint8Array(await crypto.subtle.exportKey('pkcs8', kp.privateKey)));
  return {pub, priv_enc, key_id:randCode(8)};
}
async function loadPriv(dk, priv_enc){ return crypto.subtle.importKey('pkcs8', await aesDec(await dkObj(dk), priv_enc), RSA, false, ['decrypt']); }
async function encName(pub, name){ const key = await crypto.subtle.importKey('spki', unb64(pub), RSA, false, ['encrypt']); return b64(await crypto.subtle.encrypt({name:'RSA-OAEP'}, key, new TextEncoder().encode(name))); }
async function decName(priv, s){ return new TextDecoder().decode(await crypto.subtle.decrypt({name:'RSA-OAEP'}, priv, unb64(s))); }
/* 처음 가입했거나 관리자가 비밀번호를 초기화한 뒤: 새 열쇠·자물쇠를 만들어 등록해요 */
async function ensureKeys(token, pw, wrapped, salt){
  if(!CRYPTO_OK) return null;
  let dk = null;
  if(wrapped && salt){ try{ dk = await unwrapKey(pw, wrapped, salt); }catch(e){ dk = null; } }
  const me = await store.tMe(token);
  if(!wrapped || !me.pub){
    let w = {wrapped, salt};
    if(!dk){ const k = await newDataKey(pw); dk = k.dk; w = {wrapped:k.wrapped, salt:k.salt}; }
    const kp = await newKeyPair(dk);
    await store.tSetKeys(token, w.wrapped, w.salt, kp.pub, kp.priv_enc, kp.key_id);
  }
  return dk;
}

const DRAFT_SKIP = new Set(['check','checkedText','walking','busy','helper','trail']);

const draftHas = C => !!(C && (Object.keys(C.layout||{}).length || C.treasure || norm(C.directions) || norm(C.title)));

function saveDraft(){
  if(S.view!=='create' || !S.creator || !S.profile) return;
  const C = S.creator; if(!draftHas(C)) return;
  const o = {}; for(const [k2,v] of Object.entries(C)) if(!DRAFT_SKIP.has(k2)) o[k2] = v;
  const j = JSON.stringify(o); if(j===draftLast) return; draftLast = j;
  try{ localStorage.setItem(draftKey(), j); }catch(e){}
}

  for(let r=0;r<n;r++) for(let c=0;c<n;c++){
    const isSt = r===st.r && c===st.c, b = lay[k(r,c)], P = b && PLACES[b];
    const isT = o.treasure && o.treasure.r===r && o.treasure.c===c;
    const isP = o.pick && o.pick.r===r && o.pick.c===c;
    const cls = ['cell', P?'lot':'', isSt?'start':'', isT?(o.found?'found':'treasure'):'', isP?'picked':'', (o.clickable && !isSt)?'click':'', o.trail && o.trail.has(k(r,c))?'trail':''].join(' ');

    const name = isSt ? '출발점' : P ? `${P.en} ${P.ko}` : '길';
    h += `<button class="${cls}" data-r="${r}" data-c="${c}" ${(isSt||!o.clickable)?'tabindex="-1"':''} title="${esc(name)}" aria-label="${r+1}행 ${c+1}열 ${esc(name)}${isT?' 보물':''}">${inner}</button>`;

/* 🔊 효과음 (파일 없이 브라우저에서 바로 만들어요) — 위쪽 버튼으로 끄고 켤 수 있어요 */
const SFX = {on: lsGet('tq_sfx', true), ctx: null};
function sfxCtx(){
  if(!SFX.ctx){ try{ SFX.ctx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; } }
  if(SFX.ctx.state === 'suspended') SFX.ctx.resume().catch(() => {});
  return SFX.ctx;
}
function tone(freq, dur, o={}){
  if(!SFX.on) return; const c = sfxCtx(); if(!c) return;
  const t = c.currentTime + (o.when || 0), osc = c.createOscillator(), g = c.createGain();
  osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(freq, t);
  if(o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(o.vol || .12, t + .012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g); g.connect(c.destination); osc.start(t); osc.stop(t + dur + .03);
}
const sfx = {
  step(){ tone(260, .07, {type:'triangle', vol:.13}); tone(390, .05, {type:'triangle', vol:.06, when:.035}); },
  turn(){ tone(480, .14, {vol:.12, slide:820}); },
  bump(){ tone(130, .2, {type:'square', vol:.07, slide:70}); },
  arrive(){ tone(880, .22, {vol:.14}); tone(1320, .35, {vol:.1, when:.09}); },
  success(){ [523, 659, 784, 1047].forEach((f,i) => tone(f, .2, {type:'triangle', vol:.15, when:i*.1})); tone(1568, .5, {vol:.08, when:.42}); },
  fail(){ [392, 370, 349].forEach((f,i) => tone(f, .26, {type:'sawtooth', vol:.05, when:i*.24})); tone(330, .5, {type:'sawtooth', vol:.05, when:.72, slide:200}); }
};
function sfxBtnLabel(){ const b = $('#sfxBtn'); if(b){ b.textContent = SFX.on ? '🔊 효과음' : '🔇 효과음'; b.setAttribute('aria-pressed', SFX.on); } }
/* 캐릭터와 왼쪽·오른쪽·앞 표시 */
function placeWalker(f, opts={}){
  const grid = $('#grid'); if(!grid) return;
  let w = grid.querySelector('.walker');
  if(!w){ w = document.createElement('div'); w.className = 'walker'; w.innerHTML = `<img src="${ICON[curAvatar()]}" alt=""><span class="arrow"></span>`; grid.appendChild(w); opts.instant = true; }
  const cell = grid.querySelector(`[data-r="${f.r}"][data-c="${f.c}"]`); if(!cell) return;
  if(opts.instant){ w.style.transition = 'none'; }
  w.style.width = cell.offsetWidth+'px'; w.style.height = cell.offsetHeight+'px';
  w.style.transform = `translate(${cell.offsetLeft}px, ${cell.offsetTop}px)`;
  w.querySelector('.arrow').style.transform = `rotate(${f.dir*90}deg)`;
  if(opts.instant){ w.offsetWidth; w.style.transition = ''; }
  grid.querySelectorAll('.htag').forEach(t => t.remove());
  if(opts.tags === false) return;
  const n = Math.round(Math.sqrt(grid.querySelectorAll('.cell').length));
  const a = around(f.r, f.c, f.dir);
  [['l',a.l,'왼쪽 L'],['rt',a.rt,'오른쪽 R'],['f',a.f,'앞']].forEach(([cl,p,txt]) => {
    if(!inMap(p,n)) return;
    const cc = grid.querySelector(`[data-r="${p[0]}"][data-c="${p[1]}"]`);
    const t = document.createElement('div'); t.className = 'htag ' + (cl==='rt'?'r':cl);
    t.style.width = cc.offsetWidth+'px'; t.style.height = cc.offsetHeight+'px'; t.style.transform = `translate(${cc.offsetLeft}px, ${cc.offsetTop}px)`;
    t.innerHTML = `<span>${txt}</span>`; grid.appendChild(t);
  });
}
function bumpWalker(){ const w = document.querySelector('#grid .walker'); if(w){ w.classList.remove('bump'); w.offsetWidth; w.classList.add('bump'); } }

function padState(){ return S.view==='create' ? S.creator : S.player; }
function padSize(){ return S.view==='create' ? S.creator.size : S.player.quest.size; }
function padLayout(){ return S.view==='create' ? S.creator.layout : arr2obj(S.player.quest.layout); }
function padStartObj(){ return S.view==='create' ? S.creator.start : (S.player.quest.start || qStart(S.player.quest.layout)); }
function padStart(){ const st = startOf(padSize(), padStartObj()); return {r:st.r, c:st.c, dir:st.d, si:-1}; }
function padAct(a){
  const o = padState(); if(!o || o.walking) return;
  if(!o.helper || a==='reset'){ o.helper = padStart(); placeWalker(o.helper, {instant:true}); { const sd = startOf(padSize(), padStartObj()).d; setPadMsg(`START에서 ${DIRN[sd]}(${DIRA[sd]})을 보고 있어요.`); } if(a==='reset') return; }
  const h = o.helper, n = padSize(), lay = padLayout();
  if(a==='left' || a==='right') sfx.turn();
  if(a==='left'){ h.dir = (h.dir+3)%4; setPadMsg('왼쪽으로 돌았어요. 이제 왼쪽·오른쪽 표시를 다시 봐요!'); }
  else if(a==='right'){ h.dir = (h.dir+1)%4; setPadMsg('오른쪽으로 돌았어요. 이제 왼쪽·오른쪽 표시를 다시 봐요!'); }
  else if(a==='go'){
    const np = [h.r+D[h.dir][0], h.c+D[h.dir][1]];
    if(!inMap(np,n)){ sfx.bump(); bumpWalker(); setPadMsg('더 가면 지도 밖이에요.', true); return; }
    if(lay[k(np[0],np[1])]){ sfx.bump(); bumpWalker(); setPadMsg(`${PLACES[lay[k(np[0],np[1])]].en}은(는) 지나갈 수 없어요. 돌아서 가요.`, true); return; }
    h.r = np[0]; h.c = np[1]; sfx.step(); setPadMsg('한 칸 앞으로 갔어요. (one block)');
  }
  placeWalker(h);
}

}

/* 그 단계의 조건(보물 위치 + 체크리스트)을 모두 채웠는지 */
function levelOK(C, lv){
  const pc = placeCheck(lv, C.size, C.layout, C.treasure, C.start);
  if(!pc.ok || pc.pending || !isFresh(C) || !C.check.ok) return false;
  return checklist(lv, liveCheck(C), true).every(x => x.ok);
}
/* 실제로 발행될 단계: 보통을 골랐는데 도전 조건까지 채웠다면 도전으로 올려 발행해요.
   (기본 단계는 문장 틀을 본 글이라 자동으로 올리지 않아요) */
function publishLevel(C){
  if(C.level===2 && levelOK(C,3)) return 3;
  return levelOK(C, C.level) ? C.level : 0;
}
const mapSig = C => JSON.stringify([C.size, Object.entries(C.layout).sort(), startOf(C.size, C.start), C.treasure]);
const normDir = t => String(t||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const dirSig = (C, text) => checkDirections(text||'', C.size, C.layout, C.treasure, C.start).sents.filter(x => x.kind!=='other').map(x => normDir(x.t)).join('|');   // 인사말처럼 길과 상관없는 문장은 빼고 비교
const dupSame = C => !!C.dupFrom && mapSig(C)===C.dupFrom.sig && dirSig(C, C.directions)===C.dupFrom.dir;
const canPublish = C => publishLevel(C) > 0 && !dupSame(C);
function pubHintText(C){
  if(dupSame(C)) return `📋 #${C.dupFrom.num} 퀘스트와 똑같아요. 지도나 길 안내를 바꿔야 새 퀘스트로 발행할 수 있어요.`;
  const pl = publishLevel(C);
  if(pl && pl > C.level) return `🎉 도전 단계 조건까지 모두 채웠어요! ${LV[pl].star} ${LV[pl].name} 단계로 발행돼요.`;
  if(pl) return '';
  for(const lv of [2,1]) if(lv < C.level && (lv>1 || C.level===1) && levelOK(C, lv))
    return `${LV[lv].star} ${LV[lv].name} 단계 조건은 모두 채웠어요. 위에서 단계를 ${LV[lv].name}(으)로 바꾸면 바로 발행할 수 있어요.`;
  return '체크리스트를 모두 채우면 발행할 수 있어요.';
}
const publishLabel = C => { const pl = publishLevel(C), w = PUBLIC ? '완성하기' : '발행'; return pl && pl !== C.level ? `✨ ${LV[pl].name}(으)로 ${w}` : `✨ ${w}`; };
function checklistHTML(){
  const C = S.creator, R = liveCheck(C), items = checklist(C.level, R, isFresh(C) && C.check.ok);
  const needNear = (R.betweenBad || R.nextBad) && C.treasure;
  return `<div class="clist"><p class="sub" style="margin:0">${lvlTag(C.level)} 체크리스트</p>
    <ul>${items.map(x=>`<li class="${x.ok?'on':''}"><span class="box" aria-hidden="true">${x.ok?'✔':''}</span><span><b>${esc(x.label)}</b>${x.hintHTML?`<small>${x.hintHTML}</small>`:x.hint?`<small>${esc(x.hint)}</small>`:''}</span></li>`).join('')}</ul>
    ${needNear ? `<p class="near">📍 ${esc(nearbyText(C.size, C.layout, C.treasure))}</p>` : ''}</div>`;
}
function refreshChecklist(){
  const C = S.creator, el = $('#checklist'); if(!el) return;
  el.innerHTML = checklistHTML();
  const pb = document.querySelector('[data-act="publish"]'); const ok = canPublish(C);
  if(pb){ pb.disabled = !ok || C.busy || C.walking; if(!C.busy) pb.textContent = publishLabel(C); }
  const h = $('#pubHint'); if(h){ h.className = 'hint'; h.textContent = pubHintText(C); }
}

function checkHTML(fresh, curSi){
  const R = S.creator.check;
  if(!R || (!fresh && curSi===undefined)) return '';
  const done = curSi===undefined;
  return `<div class="checkbox">
    <ol class="sents">${R.sents.map((s,i)=>{
      const st = done ? (s.bad?'bad':(s.warn.length||s.typos.length)?'warn':'') : (i===curSi?'cur':'');
      const icon = done ? (s.bad?'❌':s.typos.length?'✏️':s.warn.length?'⚠️':s.acts.length?'✅':s.kind==='place'?'📍':'💬') : (i===curSi?'🚶':'·');
      return `<li class="${st}"><span>${icon}</span><span><span class="t">${esc(s.t)}</span>
        <span class="a">${s.acts.length ? s.acts.join(' → ') : s.kind==='place' ? '장소 설명 문장' : s.kind==='typo' ? '철자가 틀려서 읽지 못한 문장' : '길과 상관없는 문장 (문장 수에 세지 않아요)'}</span>
        ${s.typos.length ? `<span class="typo">✏️ 철자 확인: ${s.typos.map(t=>`<b>${esc(t.word)}</b> → ${esc(t.fix)}`).join(', ')}</span>` : ''}
        ${done ? s.warn.map(w=>`<span class="w">${esc(w)}</span>`).join('') : ''}</span></li>`;
    }).join('')}</ol>
    ${done ? (R.ok
      ? `<div class="verdict ok">보물까지 정확하게 도착했어요! 🎉<small>${R.warnCount ? '⚠️ 표시는 친구가 헷갈릴 수 있는 문장이에요. 고치면 더 좋아요.' : '체크리스트를 모두 채웠다면 이제 발행해요!'}</small></div>`
      : `<div class="verdict bad">${esc(R.error.msg)}<small>${esc(R.error.tip||'')}</small></div>`) : ''}
  </div>`;
}

async function decryptNames(){

  if(!T.priv || T.privId !== me.key_id){ try{ T.priv = await loadPriv(T.dk, me.priv_enc); T.privId = me.key_id; }catch(e){ T.priv = null; return; } }

/* 파일 내려받기: Claude 화면에서는 확인 창, 넷리파이에서는 바로 내려받기 */
async function saveFile(filename, data, type){
  let dl = null;
  try{ dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; }catch(e){ dl = null; }
  if(dl){ try{ await dl.save({filename, data}); return true; }catch(e){ if(e && e.code==='declined') return false; } }
  try{
    const blob = data instanceof Blob ? data : new Blob([data], {type: type || 'application/octet-stream'});
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
    return true;
  }catch(e){ return false; }
}
/* 반 코드 QR 코드 (PNG) */
const joinURL = code => location.href.split('#')[0] + '#join-' + code;
function qrCard(school, label, code){
  if(typeof qrcode !== 'function') return null;
  const qr = qrcode(0, 'M'); qr.addData(joinURL(code)); qr.make();
  const n = qr.getModuleCount(), cell = Math.floor(520 / (n + 8)), qsz = cell * (n + 8);
  const W = 800, H = 1080, cv = document.createElement('canvas'); cv.width = W; cv.height = H; const g = cv.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0,0,W,H);
  g.fillStyle = '#fff0c7'; g.fillRect(0,0,W,170);
  g.fillStyle = '#1c3340'; g.textAlign = 'center';
  g.font = 'bold 44px "Jua","Gowun Dodum",sans-serif'; g.fillText('나만의 보물 지도 퀘스트', W/2, 78);
  g.font = '30px "Gowun Dodum",sans-serif'; g.fillText(`${school}  ${label}`, W/2, 130);
  const x0 = (W - qsz)/2, y0 = 200;
  g.fillStyle = '#ffffff'; g.fillRect(x0, y0, qsz, qsz); g.fillStyle = '#1c3340';
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(qr.isDark(r,c)) g.fillRect(x0 + (c+4)*cell, y0 + (r+4)*cell, cell, cell);
  g.font = '28px "Gowun Dodum",sans-serif'; g.fillStyle = '#587080'; g.fillText('반 코드', W/2, y0 + qsz + 60);
  g.font = 'bold 96px "Fredoka",sans-serif'; g.fillStyle = '#2c7fc3'; g.fillText(code.split('').join(' '), W/2, y0 + qsz + 160);
  g.font = '26px "Gowun Dodum",sans-serif'; g.fillStyle = '#1c3340';
  g.fillText('QR을 찍거나, 앱에서 반 코드를 넣고 내 번호를 써요', W/2, y0 + qsz + 225);
  return cv;
}
async function downloadQR(code, label){
  const cv = qrCard(S.teacher.school, label, code);
  if(!cv){ toast('QR 도구를 불러오지 못했어요. 반 코드를 직접 알려 주세요.'); return; }
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  const ok = await saveFile(`보물지도_${S.teacher.school}_${label}_반코드.png`.replace(/[\\/:*?"<>|\s]+/g,'_'), blob, 'image/png');
  if(ok) toast(`${label} 반 코드 QR을 내려받았어요.`);
}

/* ===== 평가 기준 (범주: AI도구를 활용한 영어 글쓰기 및 의미 전달) =====
   상: 표현 목록만 참고(⭐⭐·⭐⭐⭐ 단계) · 4문장 이상 · between 등 위치 표현 · 보물에 정확히 도착
       · 피드백을 스스로 반영해 고쳐 쓰기 · 낭독 연습(듣고 따라 읽기) 참여
   중: 표현 목록 참고(⭐⭐ 이상) · next to(또는 between) 포함 4문장 이상 · 피드백 반영 후 게시판(퀘스트 목록) 공유
   하: 문장 틀(⭐ 기본)을 활용하여 3문장 이상 완성 */
const RUBRIC_CATEGORY = 'AI도구를 활용한 영어 글쓰기 및 의미 전달';
function gradeQuest(q){
  const m = questMetrics(q), lv = q.level || 0, rev = q.revisions, lis = q.listens;
  const listOnly = lv >= 2, enough4 = m.sentCount >= 4, posExpr = m.betweenOk > 0 || m.turnAtOk > 0, near = m.nextOk > 0 || m.betweenOk > 0;
  const why = [];
  why.push(lv ? `${LV[lv].name} 단계(${listOnly?'표현 목록':'문장 틀'})` : '예전 퀘스트(단계 정보 없음)');
  why.push(`${m.sentCount}문장`);
  why.push(m.ok ? '보물 정확히 도착' : '도착 불일치');
  if(m.betweenOk) why.push('between ✓'); if(m.turnAtOk) why.push('Turn ~ at the ✓'); if(m.nextOk) why.push('next to ✓');
  if(m.reveal) why.push('보물 장소 이름 노출');
  why.push(rev==null ? '고쳐 쓰기 기록 없음(예전 퀘스트)' : rev>0 ? `피드백 반영 고쳐 쓰기 ${rev}회` : '첫 확인에 바로 통과');
  why.push(lis==null ? '낭독 연습 기록 없음(예전 퀘스트)' : `낭독 연습 ${lis}회`);
  let level = '하';
  if(m.ok && listOnly && enough4 && posExpr && (lis||0) > 0) level = '상';
  else if(m.ok && listOnly && enough4 && near) level = '중';
  const check = [];
  if(rev==null || lis==null) check.push('예전 퀘스트라 고쳐 쓰기·낭독 기록이 없어요');
  if(level==='상' && rev===0) check.push('첫 확인에 바로 통과해 고쳐 쓰기 기록이 없어요');
  if(level==='하' && lv===1 && enough4 && near && m.ok) check.push('문장 틀 단계지만 중 수준의 글이에요');
  if(level!=='상' && m.ok && listOnly && enough4 && posExpr && !(lis>0)) check.push('낭독 연습 기록만 없어 중으로 판단했어요');
  return {level, m, why:why.join(' · '), check:check.join(' / ')};
}
const RANK = {상:3, 중:2, 하:1};
/* 대표 퀘스트: 성취 수준이 가장 높은 것 → 단계 → 문장 수 */
function repQuest(p){
  return p.quests.slice().sort((a,b) => (RANK[gradeQuest(b).level]-RANK[gradeQuest(a).level]) || ((b.level||0)-(a.level||0)) || (questMetrics(b).sentCount - questMetrics(a).sentCount))[0] || null;
}
/* 통지표용 평가 문장 (~함. / ~음.) */
function evalComment(p){
  const q = repQuest(p), parts = [];
  if(!q){
    parts.push('문장 틀을 활용하여 길을 안내하는 영어 글을 쓰는 활동에 참여함.');
  } else {
    const g = gradeQuest(q), m = g.m;
    if(g.level==='상'){
      const pos = m.betweenOk ? "'between'" : "'Turn left/right at ~'";
      parts.push(`표현 목록만 참고하여 ${m.sentCount}문장의 길 안내 글을 쓰고, ${pos} 등 위치 표현을 활용하여 친구가 보물을 정확히 찾을 수 있도록 의미를 전달함.`);
      parts.push(q.revisions>0 ? 'AI 도구의 피드백을 스스로 반영하여 글을 고쳐 쓰고, 자신의 글을 듣고 따라 읽으며 낭독 연습에 주도적으로 참여함.'
                               : 'AI 도구로 자신의 글을 꼼꼼히 점검하고, 자신의 글을 듣고 따라 읽으며 낭독 연습에 주도적으로 참여함.');
    } else if(g.level==='중'){
      parts.push(`표현 목록을 참고하여 ${m.nextOk ? "'next to'를 포함한 " : "'between'을 포함한 "}${m.sentCount}문장의 길 안내 글을 작성함.`);
      parts.push(q.revisions>0 ? 'AI 도구의 피드백을 반영하여 고친 글을 게시판에 공유함.' : '완성한 글을 AI 도구로 점검한 뒤 게시판에 공유함.');
    } else {
      parts.push(m.ok && m.sentCount>=3 ? `교사와 AI가 제공하는 문장 틀을 활용하여 ${m.sentCount}문장의 길 안내 글을 완성함.`
                                        : '교사와 AI가 제공하는 문장 틀을 활용하여 길 안내 글을 쓰려고 노력함.');
    }
  }
  if(p.solved >= 1) parts.push(`친구가 쓴 길 안내 글 ${p.solved}편을 읽고 지도에서 보물을 찾음.`);
  return parts.join(' ');
}
function evalRows(people){

      '받은 하트':p.hearts, '찾은 친구 퀘스트':p.solved, '안내문':q ? q.directions.replace(/\s*\n\s*/g,' ') : '', '평가 문장':evalComment(p)

function toCSV(rows){

/* ================= actions ================= */

/* ===== 👂 듣기 연습: 지도와 길 안내문을 자동으로 만들어요 (이해 단계 · 기록 없음) =====
   1 기본: 0~1번 돌기 · 2 보통: 1~2번 돌기 + next to · 3 도전: 2~3번 돌기 + Turn ~ at the ___ + between */
const NUMS = ['zero','one','two','three','four','five','six','seven','eight'];
const cap1 = t => t.charAt(0).toUpperCase() + t.slice(1);
/* 듣기 난이도는 '단서가 적을수록, 길이 길수록' 어려워요 (쓰기와 반대: between 같은 결정적 힌트는 쓰지 않아요)
   1 기본: 아래 가운데 START ▲ · 0~1번 돌기 · 짧은 길 · 마지막에 It's next to the ___ 확인 힌트
   2 보통: 아래쪽 줄 어디서든 START ▲ · 1~2번 돌기 · 도는 곳의 장소(Turn right at the ___)만 힌트
   3 도전: 가장자리 아무 곳 (지도 가운데 쪽을 보고) · 2~3번 돌기 · 장소 힌트 없이 방향과 블록 수만 */
/* 듣기 문제 만들기: 길을 먼저 그리고(정해진 횟수만큼 돌기), 그 둘레에 건물을 놓아요.
   기본: 1번 돌기 + next to · 보통: 2번 돌기 + Turn ~ at the ___ · 도전: 3번 돌기, 가장자리 출발, 장소 힌트 없음 */
const LISTEN_RULE = {1:{turns:[1,1], steps:[4,7], seg:[1,4]}, 2:{turns:[2,2], steps:[6,9], seg:[1,3]}, 3:{turns:[3,4], steps:[8,12], seg:[1,3]}};
function genListen(level, rng=Math.random){
  const n = SIZE, pool = Object.keys(PLACES), rule = LISTEN_RULE[level] || LISTEN_RULE[1];
  const rnd = m => Math.floor(rng()*m), between = (lo,hi) => lo + rnd(hi-lo+1);
  for(let attempt=0; attempt<2000; attempt++){
    let start = null;
    if(level===2) start = {r:n-1, c:rnd(n), d:0};
    else if(level===3){
      const side = rnd(4), i = rnd(n);
      const p = side===0 ? [n-1, i] : side===1 ? [0, i] : side===2 ? [i, 0] : [i, n-1];
      start = {r:p[0], c:p[1], d:faceCenter(n, p[0], p[1])};
    }
    const st = startOf(n, start);
    /* 1) 길 그리기 */
    const turns = between(rule.turns[0], rule.turns[1]);
    const path = [[st.r, st.c]], seen = new Set([k(st.r, st.c)]), acts = [];
    let r = st.r, c = st.c, d = st.d, ok = true;
    for(let seg=0; seg<=turns && ok; seg++){
      if(seg){ const a = rnd(2) ? 'L' : 'R'; acts.push(a); d = a==='L' ? (d+3)%4 : (d+1)%4; }
      const len = between(rule.seg[0], rule.seg[1]);
      for(let i=0;i<len;i++){
        const q = [r+D[d][0], c+D[d][1]];
        if(!inMap(q,n) || seen.has(k(q[0],q[1]))){ ok = false; break; }
        r = q[0]; c = q[1]; seen.add(k(r,c)); path.push([r,c]); acts.push('F');
      }
    }
    if(!ok) continue;
    const steps = acts.filter(x => x==='F').length;
    if(steps < rule.steps[0] || steps > rule.steps[1]) continue;
    /* 2) 보물: 마지막 칸의 왼쪽·오른쪽·앞 */
    const endSide = ['left','right','front'][rnd(level===1 ? 3 : 2)];
    const sd = endSide==='left' ? (d+3)%4 : endSide==='right' ? (d+1)%4 : d;
    const treasure = {r:r+D[sd][0], c:c+D[sd][1]};
    if(!inMap([treasure.r, treasure.c], n) || seen.has(k(treasure.r, treasure.c))) continue;
    /* 3) 건물 놓기 (길과 보물 칸은 비워 둬요) */
    const layout = {}, used = new Set();
    const free = (rr,cc) => inMap([rr,cc],n) && !seen.has(k(rr,cc)) && !(rr===treasure.r && cc===treasure.c) && !layout[k(rr,cc)];
    const put = (rr,cc) => { let key; do key = pool[rnd(pool.length)]; while(used.has(key)); used.add(key); layout[k(rr,cc)] = key; };
    const cnt = (level===3 ? 12 : 10) + rnd(4);
    let guard = 0;
    while(Object.keys(layout).length < cnt && guard++ < 400){ const rr = rnd(n), cc = rnd(n); if(free(rr,cc)) put(rr,cc); }
    const nbOf = (rr,cc) => [[rr-1,cc],[rr+1,cc],[rr,cc-1],[rr,cc+1]].filter(q => inMap(q,n));
    if(level===1 && !nbOf(treasure.r, treasure.c).some(q => layout[k(q[0],q[1])])){
      const f = nbOf(treasure.r, treasure.c).filter(q => free(q[0],q[1])); if(!f.length) continue; const q = f[rnd(f.length)]; put(q[0], q[1]);
    }
    /* 4) 안내문 */
    const out = []; let run = 0; r = st.r; c = st.c; d = st.d;
    const flush = () => { if(run){ out.push(`Go straight ${NUMS[run]} block${run>1?'s':''}.`); run = 0; } };
    let bad = false;
    for(const a of acts){
      if(a==='F'){ r += D[d][0]; c += D[d][1]; run++; continue; }
      flush();
      const side = a==='L' ? 'left' : 'right';
      if(level===2){
        let near = nbOf(r,c).map(q => layout[k(q[0],q[1])]).filter(Boolean);
        if(!near.length){ const f = nbOf(r,c).filter(q => free(q[0],q[1])); if(!f.length){ bad = true; break; } const q = f[rnd(f.length)]; put(q[0],q[1]); near = [layout[k(q[0],q[1])]]; }
        out.push(`Turn ${side} at the ${pn(near[rnd(near.length)])}.`);
      } else out.push(`Turn ${side}.`);
      d = a==='L' ? (d+3)%4 : (d+1)%4;
    }
    if(bad) continue;
    flush();
    out.push(endSide==='front' ? "It's in front of you." : `It's on your ${endSide}.`);
    if(level===1){ const tn = [...new Set(nbOf(treasure.r, treasure.c).map(q => layout[k(q[0],q[1])]).filter(Boolean))]; if(!tn.length) continue; out.push(`It's next to the ${pn(tn[rnd(tn.length)])}.`); }

function speakWait(text, rate=.8){

    let done = false; const fin = () => { if(!done){ done = true; res(); } };
    try{
      speechSynthesis.cancel();

      const v = speechSynthesis.getVoices().find(x => /^en(-|_)US/i.test(x.lang)); if(v) u.voice = v;
      u.onend = fin; u.onerror = fin; speechSynthesis.speak(u);
    }catch(e){ fin(); }
    setTimeout(fin, 1500 + text.split(/\s+/).length * 700 / rate);
  });
}

  }

}

async function dupQuest(num){

async function walk(){
  const C = S.creator;
  const text = C.directions.trim();
  if(text.length < 10){ $('#dirErr').textContent = '길 안내를 조금 더 써 주세요.'; return; }
  if(/[ㄱ-ㅎㅏ-ㅣ가-힣]/.test(text)){ $('#dirErr').textContent = '안내문은 영어로만 써 주세요.'; return; }
  const R = checkDirections(C.directions, C.size, C.layout, C.treasure, C.start);
  // AI 피드백을 받은 횟수(고쳐 쓰기 근거): 도착 실패·체크리스트 미완성·주의 문장이 있으면 1번
  const perfect = R.ok && R.warnCount===0 && checklist(C.level, R, true).every(x => x.ok);
  if(!perfect) C.revisions++;
  C.check = R; C.checkedText = C.directions; C.walking = true; C.trail = null; C.helper = null;
  vCreate();
  placeWalker(R.frames[0], {instant:true});
  const trail = new Set(), area = $('#checkArea');
  let prevF = R.frames[0];
  for(const f of R.frames.slice(1)){
    area.innerHTML = checkHTML(false, f.si);
    if(f.bump){ sfx.bump(); bumpWalker(); await sleep(REDUCED?0:500); continue; }
    (f.r===prevF.r && f.c===prevF.c) ? sfx.turn() : sfx.step(); prevF = f;
    placeWalker(f); trail.add(k(f.r,f.c));
    const cell = $('#grid').querySelector(`[data-r="${f.r}"][data-c="${f.c}"]`); if(cell) cell.classList.add('trail');
    await sleep(REDUCED?0:450);
  }
  C.trail = trail; C.walking = false;
  const last = R.frames[R.frames.length-1];
  C.helper = {r:last.r, c:last.c, dir:last.dir};
  vCreate();
  if(R.target && inMap(R.target, C.size)){
    const cell = $('#grid').querySelector(`[data-r="${R.target[0]}"][data-c="${R.target[1]}"]`);
    if(cell) cell.classList.add('aim', ...(R.ok?[]:['miss']));
  }
  if(R.ok){ sfx.success(); confetti(60); } else sfx.fail();
  // 쓰던 칸이 화면 밖으로 밀리지 않도록 스크롤하지 않고, 결과 한 줄을 버튼 바로 아래에 보여 줘요
  const ph = $('#pubHint');
  if(ph){ ph.className = 'walkres ' + (R.ok ? 'ok' : 'bad');
    ph.textContent = R.ok ? (canPublish(C) ? (publishLevel(C) > C.level ? pubHintText(C) : '🎉 보물까지 정확히 도착! 이제 발행할 수 있어요.') : '🎉 보물까지 도착! ' + pubHintText(C))
      : `❌ ${R.error.msg}` + (R.typoCount ? ' 철자가 틀린 낱말이 있어요. ✏️ 표시를 확인해요.' : ' (자세한 결과는 아래에 있어요)'); }
}

    case 'eggSmall': {                     // 9×9 → 7×7: 넓힐 때와 반대로 옮겨요
      const lay = {}; let lost = 0;
      Object.entries(C.layout).forEach(([kk,v]) => { const [r,c] = kk.split('-').map(Number), r2 = r-2, c2 = c-1;
        if(r2>=0 && r2<7 && c2>=0 && c2<7) lay[k(r2,c2)] = v; else lost++; });
      let tLost = false;
      if(C.treasure){ const r2 = C.treasure.r-2, c2 = C.treasure.c-1; if(r2>=0 && r2<7 && c2>=0 && c2<7) C.treasure = {r:r2, c:c2}; else { C.treasure = null; tLost = true; } }
      if(C.start){ const r2 = C.start.r-2, c2 = C.start.c-1; C.start = (r2>=0 && r2<7 && c2>=0 && c2<7) ? {r:r2, c:c2, d:C.start.d} : null; }
      C.layout = lay; C.size = 7; C.check = null; C.trail = null; C.helper = null;

      const lay = {};
      Object.entries(C.layout).forEach(([kk,v]) => { const [r,c] = kk.split('-').map(Number); lay[k(r+2,c+1)] = v; });
      C.layout = lay; if(C.treasure) C.treasure = {r:C.treasure.r+2, c:C.treasure.c+1};
      if(C.start) C.start = {r:C.start.r+2, c:C.start.c+1, d:C.start.d};

function cellClick(r,c){
  if(S.view==='board'){
    const B = S.board, it = B.items[B.i]; if(B.reveal[B.i]) return;
    const st = startOf(it.size, it.start); if(r===st.r && c===st.c) return;
    const gs = guessesOf(B), last = gs.length - 1;
    const j = gs.map((g,i)=>[g,i]).filter(([g]) => g.r===r && g.c===c).map(([,i])=>i).pop();
    if(j!==undefined && j===last) gs.splice(j,1);          // 같은 칸을 다시 누르면 마지막 표시를 지워요
    else if(gs.length < GMAX){ gs.push({r,c}); sfx.step(); }
    else { toast(`예상은 ${GMAX}명까지 찍을 수 있어요. 「예상 지우기」로 다시 시작해요.`); return; }
    const box = document.querySelector('.guessbox'); if(box) box.outerHTML = guessBoxHTML(B, it, false);
    drawGuesses(); return;
  }
  if(S.view==='create'){
    const C = S.creator, st = startOf(C.size, C.start);
    if(r===st.r && c===st.c) return;
    if(C.step===1){                                   // 출발점 고르기
      C.start = {r, c, d: faceCenter(C.size, r, c)};
      delete C.layout[k(r,c)]; if(C.treasure && C.treasure.r===r && C.treasure.c===c) C.treasure = null;
    }
    else if(C.step===2) C.treasure = {r,c};
    else if(C.step===3){ const kk = k(r,c); if(C.layout[kk]) delete C.layout[kk]; else C.layout[kk] = C.sel; }   // 장소가 있는 칸을 누르면 지워져요
    else return;
    C.check = null; C.trail = null; vCreate();
  } else if(S.view==='play'){
    const PL = S.player, st = startOf(PL.quest.size, PL.quest.start || qStart(PL.quest.layout));
    if(PL.solved || PL.busy || (r===st.r && c===st.c)) return;
    PL.pick = {r,c}; PL.msg = false; vPlay();
  }
}

function copyLegacy(text){
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';
  document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
  let ok = false; try{ ok = document.execCommand('copy'); }catch(e){}
  ta.remove(); return ok;
}
async function copy(text){
  let ok = copyLegacy(text);
  if(!ok){ try{ await navigator.clipboard.writeText(text); ok = true; }catch(e){} }
  if(ok) return toast('복사했어요 ✔');
  const f = document.querySelector('.copyfield'); if(f){ f.focus(); f.select(); }
  toast(f ? '아래 칸이 선택됐어요. Ctrl + C 를 눌러 복사해요' : '복사가 안 되면 직접 적어 주세요: ' + text);
}

function confetti(count=140){
  if(REDUCED) return;
  const cv = document.createElement('canvas'); cv.id = 'confetti'; document.body.appendChild(cv);
  const ctx = cv.getContext('2d'); const W = cv.width = innerWidth, H = cv.height = innerHeight;
  const cols = ['#ffb627','#2c7fc3','#1f9256','#f0679a','#8a5cf5'];
  const ps = Array.from({length:count}, () => ({x:W/2, y:H*0.35, vx:(Math.random()-.5)*14, vy:Math.random()*-12-4, s:Math.random()*7+4, c:cols[Math.floor(Math.random()*cols.length)], r:Math.random()*6}));
  let t = 0;
  (function f(){
    ctx.clearRect(0,0,W,H);
    ps.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += .2; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); });
    if(++t < 150) requestAnimationFrame(f); else cv.remove();
  })();
}

/* ================================================================
   🔗 공유판 (PUBLIC): 서버 없이 쓰는 버전
   · 로그인·반 코드·이름 없음. 내 캐릭터와 이름만 이 기기에 저장해요(링크에는 안 들어가요).
   · 퀘스트를 발행하면 지도와 안내문이 통째로 담긴 링크·QR이 만들어져요. 친구는 링크를 열거나 QR을 찍어 풀어요.
   ================================================================ */
const PKEYS = Object.keys(PLACES), TKEYS = Object.keys(TREASURES), PUB_MINE = 'tq_pub_mine';
const b64url = u8 => b64(u8).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64url = s => unb64(s.replace(/-/g,'+').replace(/_/g,'/') + '==='.slice((s.length + 3) % 4));
async function zip(bytes, how){
  const cs = how==='c' ? new CompressionStream('deflate-raw') : new DecompressionStream('deflate-raw');
  const out = new Response(new Blob([bytes]).stream().pipeThrough(cs));
  return new Uint8Array(await out.arrayBuffer());
}
/* 퀘스트 → 짧은 코드 */
async function encodeQuest(q){
  const n = q.size, p = Object.entries(q.layout).map(([kk,b]) => { const [r,c] = kk.split('-').map(Number);
    return (r*n+c).toString(36).padStart(2,'0') + PKEYS.indexOf(b).toString(36).padStart(2,'0'); }).join('');
  const st = q.start && !isDefaultStart(n, q.start) ? [q.start.r, q.start.c, q.start.d] : 0;
  const o = {v:1, t:q.title, l:q.level, s:n, r:[q.treasure.r, q.treasure.c], i:Math.max(0, TKEYS.indexOf(q.icon)), p, st, d:q.directions, e:q.egg ? 1 : 0};

}
/* 짧은 코드 → 퀘스트 */
async function decodeQuest(code){
  code = String(code||'').trim();
  const m = code.match(/#s=([A-Za-z0-9_-]+)/); if(m) code = m[1];
  if(!/^[zj][A-Za-z0-9_-]{8,}$/.test(code)) return null;

  if(code[0]==='z') bytes = await zip(bytes, 'd');
  const o = JSON.parse(new TextDecoder().decode(bytes)), n = o.s;
  if(!o || o.v!==1 || ![5,7,9].includes(n)) return null;
  const layout = {};
  for(let i=0;i+4<=String(o.p||'').length;i+=4){
    const cell = parseInt(o.p.slice(i,i+2),36), key = PKEYS[parseInt(o.p.slice(i+2,i+4),36)];
    if(key && cell>=0 && cell<n*n) layout[k(Math.floor(cell/n), cell%n)] = key;
  }
  const start = Array.isArray(o.st) ? {r:o.st[0], c:o.st[1], d:o.st[2]} : null;
  const title = String(o.t||'').slice(0,20), directions = String(o.d||'').slice(0,600);
  if(hasBad(title) || hasBad(directions)) return null;
  return {title, level:o.l||1, size:n, layout, start, treasure:{r:o.r[0], c:o.r[1]}, icon:TKEYS[o.i]||'t_chest', directions, egg:!!o.e, code};
}

function qrDataURL(text, cell=5){
  if(typeof qrcode !== 'function') return null;
  try{ const qr = qrcode(0, 'L'); qr.addData(text); qr.make(); return qr.createDataURL(cell, 4); }catch(e){ return null; }
}
/* 공유 QR 카드 (PNG 저장용) */
function shareCard(title, url){
  if(typeof qrcode !== 'function') return null;
  const qr = qrcode(0, 'L'); qr.addData(url); qr.make();
  const n = qr.getModuleCount(), cell = Math.max(4, Math.floor(640 / (n + 8))), qsz = cell * (n + 8);

  g.fillStyle = '#fff'; g.fillRect(0,0,W,H); g.fillStyle = '#fff0c7'; g.fillRect(0,0,W,150);
  g.fillStyle = '#1c3340'; g.textAlign = 'center';
  g.font = 'bold 42px "Jua","Gowun Dodum",sans-serif'; g.fillText('나만의 보물 지도 퀘스트', W/2, 70);
  g.font = '34px "Fredoka","Gowun Dodum",sans-serif'; g.fillText(title, W/2, 122);
  const x0 = (W - qsz)/2, y0 = 180;
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(qr.isDark(r,c)) g.fillRect(x0 + (c+4)*cell, y0 + (r+4)*cell, cell, cell);
  g.font = '26px "Gowun Dodum",sans-serif'; g.fillStyle = '#587080';
  g.fillText('QR을 찍으면 이 퀘스트가 바로 열려요. 안내문을 읽고 보물을 찾아요!', W/2, y0 + qsz + 70);
  return cv;
}

/* ⬇ 지도 그림(PNG): 패들릿 등에 올리기 좋게 지도와 안내문을 한 장으로 (보물 위치는 숨겨요) */
const loadImg = src => new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
async function mapPNG(Q, showTreasure, who){
  const n = Q.size, cell = Math.floor(760 / n), gap = 4, G = cell * n, W = G + 80, st = startOf(n, Q.start);
  const lines = [], words = String(Q.directions).split(/\s+/), cv = document.createElement('canvas'), g = cv.getContext('2d');

  const H = 130 + G + 40 + lines.length * 40 + 120; cv.width = W; cv.height = H;
  g.fillStyle = '#fffaf0'; g.fillRect(0,0,W,H);
  g.fillStyle = '#1c3340'; g.textAlign = 'center'; g.font = 'bold 40px "Jua","Gowun Dodum",sans-serif'; g.fillText(Q.title, W/2, 60);
  g.font = '22px "Gowun Dodum",sans-serif'; g.fillStyle = '#587080'; g.fillText(`${who ? who + ' · ' : ''}${(LV[Q.level]||LV[1]).star} ${(LV[Q.level]||LV[1]).name} · ${n} × ${n} 지도 · START에서 ${DIRA[st.d]} 방향으로 출발`, W/2, 98);
  const x0 = 40, y0 = 120; g.fillStyle = '#e8d6a8'; g.fillRect(x0-6, y0-6, G+12, G+12);
  const lay = Q.layout, imgs = {};
  for(const key of new Set([...Object.values(lay), 'start', Q.icon])) imgs[key] = await loadImg(ICON[key]);
  let stXY = null;
  for(let r=0;r<n;r++) for(let c=0;c<n;c++){
    const x = x0 + c*cell + gap/2, y = y0 + r*cell + gap/2, s = cell - gap, b = lay[k(r,c)], isSt = r===st.r && c===st.c;
    g.fillStyle = b || isSt ? '#f6e6bd' : '#5b6670'; g.fillRect(x, y, s, s);
    if(!b && !isSt){ g.strokeStyle = 'rgba(255,255,255,.35)'; g.setLineDash([5,5]); g.beginPath(); g.moveTo(x+s/2, y); g.lineTo(x+s/2, y+s); g.moveTo(x, y+s/2); g.lineTo(x+s, y+s/2); g.stroke(); g.setLineDash([]); }
    const im = isSt ? imgs.start : b ? imgs[b] : null; if(im) g.drawImage(im, x+s*.08, y+s*.04, s*.84, s*.84);
    if(b){ g.font = `${Math.max(10, Math.floor(cell/7))}px Arial`; g.fillStyle = '#1c3340'; g.textAlign = 'center'; g.fillText(PLACES[b].en, x+s/2, y+s-4); }
    if(isSt){ g.strokeStyle = '#e0245e'; g.lineWidth = 5; g.strokeRect(x+2, y+2, s-4, s-4); g.lineWidth = 1; stXY = [x, y, s]; }
    if(showTreasure && Q.treasure.r===r && Q.treasure.c===c && imgs[Q.icon]) g.drawImage(imgs[Q.icon], x+s*.2, y+s*.2, s*.6, s*.6);
  }
  if(stXY){ const [x, y, s] = stXY;                     // 출발 화살표는 다른 칸 위에 보이도록 마지막에 그려요
      g.save(); g.translate(x+s/2 + D[st.d][1]*s*.55, y+s/2 + D[st.d][0]*s*.55); g.rotate(st.d*Math.PI/2);
      g.fillStyle = '#e0245e'; g.strokeStyle = '#fff'; g.lineWidth = 3; g.beginPath(); const a = s*.22;
      g.moveTo(0,-a); g.lineTo(a,0); g.lineTo(a*.45,0); g.lineTo(a*.45,a); g.lineTo(-a*.45,a); g.lineTo(-a*.45,0); g.lineTo(-a,0); g.closePath(); g.fill(); g.stroke(); g.restore(); g.lineWidth = 1; }
  g.fillStyle = '#1c3340'; g.textAlign = 'left'; g.font = '28px "Fredoka","Gowun Dodum",sans-serif';
  lines.forEach((t,i) => g.fillText(t, 40, y0 + G + 50 + i*40));
  g.textAlign = 'left'; g.font = '20px "Gowun Dodum",sans-serif'; g.fillStyle = '#2f7a4a';
  const cl = items.map(x => (x.ok ? '✔ ' : '✘ ') + x.label).join('   ');
  let cy = H - 78, line = ''; for(const part of cl.split('   ')){ const t = line ? line + '   ' + part : part; if(g.measureText(t).width > W - 80){ g.fillText(line, 40, cy); cy += 26; line = part; } else line = t; } if(line) g.fillText(line, 40, cy);
  g.textAlign = 'center'; g.font = '20px "Gowun Dodum",sans-serif'; g.fillStyle = '#8a9aa6';
  g.fillText(`${R.sentCount}문장 · 찾을 보물: ${TREASURES[Q.icon]} · 나만의 보물 지도 퀘스트`, W/2, H - 18);
  return await new Promise(r => cv.toBlob(r, 'image/png'));
}
